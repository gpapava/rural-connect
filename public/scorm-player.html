<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SCORM Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #f9fafb; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    #error {
      display: none; position: absolute; inset: 0;
      align-items: center; justify-content: center;
      background: #f9fafb; font-family: sans-serif; color: #374151; text-align: center; padding: 2rem;
    }
  </style>
</head>
<body>
  <iframe id="frame" allow="fullscreen" allowfullscreen></iframe>
  <div id="error">
    <div>
      <p style="font-size:1rem;font-weight:600;margin-bottom:.5rem">Unable to load SCORM content</p>
      <p style="font-size:.875rem;color:#6b7280">No URL was provided.</p>
    </div>
  </div>

  <script>
    // ── Shared data store ──────────────────────────────────────────────────────
    var cmiData = {};

    function getValue(key) {
      return cmiData.hasOwnProperty(key) ? String(cmiData[key]) : "";
    }

    function setValue(key, value) {
      cmiData[key] = value;
      return "true";
    }

    // ── SCORM 1.2 API ─────────────────────────────────────────────────────────
    window.API = {
      LMSInitialize:    function(_) { return "true"; },
      LMSFinish:        function(_) { return "true"; },
      LMSGetValue:      function(e) { return getValue(e); },
      LMSSetValue:      function(e, v) { return setValue(e, v); },
      LMSCommit:        function(_) { return "true"; },
      LMSGetLastError:  function()  { return "0"; },
      LMSGetErrorString: function(_) { return ""; },
      LMSGetDiagnostic:  function(_) { return ""; }
    };

    // ── SCORM 2004 API ────────────────────────────────────────────────────────
    window.API_1484_11 = {
      Initialize:       function(_) { return "true"; },
      Terminate:        function(_) { return "true"; },
      GetValue:         function(e) { return getValue(e); },
      SetValue:         function(e, v) { return setValue(e, v); },
      Commit:           function(_) { return "true"; },
      GetLastError:     function()  { return "0"; },
      GetErrorString:   function(_) { return ""; },
      GetDiagnostic:    function(_) { return ""; }
    };

    // ── Hide the Storyline outline / menu sidebar + fit the slide ─────────────
    // The published package bakes the menu into its player and is published with
    // "Lock at optimal size / no scaling", so it never resizes itself. We strip
    // the menu here and scale the slide area to fill the viewport, so the
    // presentation shows as a clean, full-width interactive slide deck.
    var HIDE_MENU_CSS = [
      ".area-secondary, .cs-menu, .outline-panel, #tab-outline, .menu-handle, .mobile-menu-title { display: none !important; }",
      ".area-primary {",
      "  width: 100% !important; left: 0 !important; padding: 0 !important;",
      "  -webkit-box-flex: 1 !important; -webkit-flex: 1 1 100% !important;",
      "  -ms-flex: 1 1 100% !important; flex: 1 1 100% !important;",
      "}",
      ".main-window-slide-container, .cs-slide-container {",
      "  width: var(--rc-slide-w, 720px) !important; margin: 0 auto !important; left: 0 !important;",
      "}",
      ".presentation-wrapper { width: var(--rc-slide-w, 720px) !important; }",
      ".presentation-wrapper.sidebar-left .message-window, .sidebar-left .message-window { margin-left: 0 !important; }",
      "html, body { overflow: hidden !important; }"
    ].join("\n");

    // Fit the Storyline slide area into the iframe: inject the layout CSS (once)
    // and re-scale the player wrapper on every call (cheap, idempotent).
    function fitPresentation(frameEl) {
      try {
        var doc = frameEl.contentDocument || frameEl.contentWindow.document;
        var win = frameEl.contentWindow;
        if (!doc || !win) return;

        if (!doc.getElementById("rc-hide-menu")) {
          var s = doc.createElement("style");
          s.id = "rc-hide-menu";
          s.textContent = HIDE_MENU_CSS;
          (doc.head || doc.documentElement).appendChild(s);
        }

        var wrap = doc.querySelector(".presentation-wrapper");
        var slide = doc.querySelector(".slide-container, .slide");
        if (!wrap || !slide) return;

        var slideW = parseFloat(slide.style.width) || slide.getBoundingClientRect().width || 720;
        var wrapH = parseFloat(wrap.style.height) || wrap.getBoundingClientRect().height || 523;
        if (!slideW || !wrapH) return;

        doc.documentElement.style.setProperty("--rc-slide-w", slideW + "px");

        var scale = Math.min(win.innerWidth / slideW, win.innerHeight / wrapH);
        if (!isFinite(scale) || scale <= 0) return;
        if (scale > 1.6) scale = 1.6;

        wrap.style.transformOrigin = "0 0";
        wrap.style.transform = "scale(" + scale.toFixed(4) + ")";
      } catch (e) {
        // cross-origin or not ready yet — ignore
      }
    }

    // ── Load content ──────────────────────────────────────────────────────────
    var params = new URLSearchParams(location.search);
    var url = params.get("url");
    var frame = document.getElementById("frame");

    if (url) {
      // Storyline redirects (index_lms.html -> index_lms_html5.html) and builds
      // its DOM asynchronously, so re-fit on every load and poll briefly after.
      frame.addEventListener("load", function () {
        fitPresentation(frame);
        var tries = 0;
        var iv = setInterval(function () {
          fitPresentation(frame);
          if (++tries >= 30) clearInterval(iv);
        }, 500);
      });
      window.addEventListener("resize", function () { fitPresentation(frame); });
      frame.src = url;
    } else {
      var err = document.getElementById("error");
      err.style.display = "flex";
    }
  </script>
</body>
</html>
